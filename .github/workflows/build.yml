name: Tests and builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests and debug builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test native symbol preparation
        run: python3 -m unittest discover -s scripts/tests -p test_prepare_android_symbols.py -v

      - name: Run shared tests on Android
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Test the local mock API
        run: python3 -m unittest discover -s scripts/tests -p test_mock_api.py -v

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: shared/build/reports/tests/

      - name: Upload Android debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Verify MapLibre libraries in the Android release bundle
        run: |
          ./gradlew :androidApp:bundleRelease --stacktrace
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          abis = {"arm64-v8a", "armeabi-v7a", "x86_64"}
          libraries = {"libjniMaplibreNativeC.so", "libmaplibre-native-c.so"}
          expected = {f"base/lib/{abi}/{library}" for abi in abis for library in libraries}
          bundles = list(Path("androidApp/build/outputs/bundle").rglob("*-release.aab"))
          if len(bundles) != 1:
              raise SystemExit(f"Expected one Android release bundle, found: {bundles}")
          with ZipFile(bundles[0]) as bundle:
              native_libraries = {
                  entry.filename
                  for entry in bundle.infolist()
                  if entry.filename.startswith("base/lib/")
                  and entry.filename.endswith(".so")
                  and entry.file_size > 0
              }

          packaged_abis = {name.split("/")[2] for name in native_libraries}
          if packaged_abis != abis:
              raise SystemExit(f"Unexpected release ABI coverage: {sorted(packaged_abis)}")

          packaged = {name for name in native_libraries if name.rsplit("/", 1)[-1] in libraries}
          if packaged != expected:
              raise SystemExit(
                  f"MapLibre ABI mismatch. Missing: {sorted(expected - packaged)}. "
                  f"Unexpected: {sorted(packaged - expected)}."
              )
          PY

  ios:
    name: iOS tests and simulator build
    # The project only supports arm64 iOS simulators.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Keep CI on the Xcode version used for the shared iOS framework.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Apple toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run shared tests on iOS
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Build iOS simulator app
        # Override the local Android Studio Java path from Config.xcconfig.
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            JAVA_HOME="$JAVA_HOME" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: shared/build/reports/tests/

      - name: Package iOS simulator app
        run: tar -czf build/ios-simulator-app.tar.gz -C build/ios/Build/Products/Debug-iphonesimulator UKMotorcycleParking.app

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios-simulator-app.tar.gz
          if-no-files-found: error
